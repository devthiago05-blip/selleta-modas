<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Selleta Modas - Moda feminina</title>
  <desc id="desc">Imagem social da Selleta Modas com chamada para moda feminina elegante.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf4"/>
      <stop offset="48%" stop-color="#f4dfc1"/>
      <stop offset="100%" stop-color="#8a5d2b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2f2924" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="190" fill="#ffffff" opacity="0.18"/>
  <circle cx="120" cy="580" r="220" fill="#2f2924" opacity="0.08"/>
  <g filter="url(#shadow)">
    <rect x="90" y="90" width="1020" height="450" rx="44" fill="#fffaf4" opacity="0.92"/>
  </g>
  <text x="140" y="220" fill="#8a5d2b" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700">Selleta Modas</text>
  <text x="144" y="284" fill="#2f2924" font-family="Arial, sans-serif" font-size="30" letter-spacing="7">MODA FEMININA</text>
  <text x="140" y="370" fill="#2f2924" font-family="Arial, sans-serif" font-size="42" font-weight="700">Vestidos, conjuntos e looks femininos</text>
  <text x="140" y="426" fill="#6b6259" font-family="Arial, sans-serif" font-size="28">Compra online, atendimento pelo WhatsApp e acompanhamento do pedido.</text>
  <rect x="140" y="470" width="276" height="54" rx="27" fill="#8a5d2b"/>
  <text x="178" y="506" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Conheça a coleção</text>
</svg>
